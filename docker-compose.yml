name: iptv
services:
  iptv:
    container_name: iptv
    hostname: iptv
    image: iptv
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    volumes:
      - type: bind
        source: /etc/iptv
        target: /etc/iptv
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
      - target: 5000
        published: "5000"
        protocol: tcp
    network_mode: bridge